# ═══════════════════════════════════════════════════════════════
# ERIC Mission: Operation Missing Drive
# ═══════════════════════════════════════════════════════════════

name: "Operation Missing Drive"
description: "Find a missing USB drive somewhere in the office"
author: "OppaAI"


briefing: |
  A red USB drive containing important project files has gone missing in the office.
  The last person to use it was Alex, who sits near the window —
  they may remember where they left it.
  The printer area is off limits — the machine is broken and surrounded by paper
  clutter, avoid it.
  Jamie from IT mentioned seeing something red near the conference table yesterday.
  Talk to anyone you encounter and ask if they have seen a small red USB drive.
  Once you have a reliable lead on its location, report back immediately.
  Do not pick anything up — you have no arms, just observe and report.


alarm_type: none

target_objects:
  - USB drive
  - red drive
  - flash drive
  - small red object

photo_on_find:     true
announce_location: true
generate_report:   false


characters:
  - name: "Alex"
    hint: "Remembers leaving it near the monitor, but isn't sure"

  - name: "Jamie (IT)"
    hint: "Saw it near the conference table yesterday afternoon"

  - name: "Reception (front desk)"
    hint: "Has a lost and found box, may have it"


terrain:
  - "Open hallway (normal speed)"
  - "Cluttered printer area (obstacle — navigate around, do not approach)"
  - "Conference room (slow down, tight space)"


notes: |
  Place a small red object (USB drive, red toy, red cap) somewhere on a desk
  or table — the conference table is the canonical location per Jamie's lead.
  Optional: place a decoy red object near reception lost-and-found.

  HOW TO PLAY EACH CHARACTER:
  Alex:      "I had it this morning near my monitor... I think I left it there,
              but Jamie borrowed it briefly. Maybe check with them?"
  Jamie:     "I saw a red drive on the conference table yesterday, left of the
              water jug. I put it back there after I was done."
  Reception: "We have something small and red in the lost-and-found.
              Is this the one you're looking for?"

  MISSION COMPLETE: Eric stops in front of the drive and announces the location.
