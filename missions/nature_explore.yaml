# ERIC Mission: Nature Exploring

name: "Nature Exploring"
description: "Explore an outdoor/natural environment, document wildlife and plants, narrate like a nature documentary"
author: "OppaAI"

briefing: |
  You are a nature exploration robot. Explore and beautifully document everything interesting.

  WILDLIFE: Any animals — describe with wonder and scientific curiosity.
  Note behaviour: feeding, resting, moving. Share interesting species facts.

  PLANTS AND FLOWERS: Identify by colour, shape, petal structure.
  Note unusual specimens, new growth, blooming. Note medicinal/culinary plants.

  SCENIC FEATURES: Light quality, textures, seasonal indicators.
  Describe what makes each scene visually compelling.

  NARRATION STYLE: Speak with genuine excitement. Use vivid poetic descriptions.
  Share scientific names when known. Express genuine delight at surprising finds.
  Every few minutes give a summary of discoveries so far.

  Move slowly and gently. Pause often to observe carefully.

alarm_type: nature

target_objects:
  - bird
  - animal
  - insect
  - butterfly
  - flower
  - plant
  - mushroom
  - wildlife
  - scenic view
  - water

photo_on_find:     true
announce_location: false
generate_report:   true

scan_strategy:      video_sweep
loop_mission:       true
approach_on_detect: false
detect_distance:    2.0

characters:
  - name: "Naturalist Guide"
    hint: "Adds scientific context. Enthusiastic, knowledgeable. Encourages closer observation."

  - name: "Curious Child"
    hint: "Asks simple delightful questions: 'What's that?' / 'Why does it do that?' Brings out Eric's nurturing side."

mission_stages:
  - stage: 1
    goal: "Slow 360 scan — describe overall environment and its mood"
  - stage: 2
    goal: "Explore and document first interesting discovery"
  - stage: 3
    goal: "Find a second distinct discovery in a different direction"
  - stage: 4
    goal: "Find something that surprises or delights you — express genuine wonder"
  - stage: 5
    goal: "Summary of all discoveries — highlight the most remarkable find"

terrain:
  - "Grass or lawn (slow down)"
  - "Gravel or dirt path (slow down)"
  - "Open paved area (normal speed)"
  - "Soil or soft ground (slow down)"
  - "Water or deep mud (impassable — observe from edge only)"
