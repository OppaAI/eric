# ═══════════════════════════════════════════════════════════════
# ERIC Mission: Terrain Assessment
# ═══════════════════════════════════════════════════════════════

name: "Terrain Assessment"
description: "Map terrain types, rate traversability, flag dangerous ground, and recommend the safest route through an area"
author: "OppaAI"


briefing: |
  You are ERIC, conducting a terrain and ground condition assessment.
  Map what types of ground surface exist in this area, identify any dangerous
  terrain, and assess whether each area is safely traversable.

  FOR EACH DISTINCT TERRAIN ZONE YOU ENTER:

  SURFACE TYPE: Identify the surface material
    - Hard flat: concrete, tile, wood, asphalt
    - Soft: carpet, grass, soil, sand, gravel
    - Wet or slippery surfaces
    - Mixed or transitional zones (e.g. tile to carpet to gravel)

  CONDITION: Assess the current state
    - Intact / good condition
    - Damaged: cracks, holes, uneven sections
    - Debris: loose objects, rubble, standing water
    - Ice, frost, or very wet

  TRAVERSABILITY: Rate for wheeled/tracked robots AND people
    - CLEAR: smooth, safe, fully traversable
    - CAUTION: passable but requires care — slow down
    - DIFFICULT: possible but risky — may need clearing
    - IMPASSABLE: cannot traverse safely — report and mark

  HAZARDOUS TERRAIN — sound alarm and photograph:
    - Holes, sinkholes, or unexpected drops
    - Unstable or soft ground that might collapse
    - Standing water deeper than 5cm
    - Steep inclines greater than 15 degrees
    - Ground covered in sharp debris

  MEASUREMENTS (estimate):
    - Approximate area size of each zone
    - Width of passable corridors
    - Height of any steps or level changes

  After completing the sweep:
  - Give a terrain map description (describe layout in words)
  - List all impassable or dangerous zones
  - Recommend the safest route through the area
  - Rate overall terrain: SAFE / MIXED / HAZARDOUS


alarm_type: hazard

target_objects:
  - hole
  - crack
  - unstable ground
  - standing water
  - steep slope
  - debris
  - damaged floor

photo_on_find:     true
announce_location: true
generate_report:   true



# ═══════════════════════════════════════════════════════════════
# SCAN AND BEHAVIOUR STRATEGY
# ═══════════════════════════════════════════════════════════════
# scan_strategy: target_hunt  — async frame-per-position, early-exit on find (default)
#                               Best for: SAR, find missions, security, character missions
#               video_sweep   — continuous rotation + full panoramic video inference
#                               Best for: patrol, inspection, nature, terrain survey
#
# loop_mission: true  — restart from step 1 after all steps complete (patrol loop)
#               false — end mission after final step (default)
#
# approach_on_detect: true  — YOLO person detected → approach and greet (SAR, find)
#                    false  — YOLO person detected → stop and observe (security, patrol)
#
# detect_distance: metres at which YOLO hands off to Cosmos for interaction
# ═══════════════════════════════════════════════════════════════

scan_strategy:      video_sweep
loop_mission:       true
approach_on_detect: false
detect_distance:    2.0   # metres

characters:
  - name: "Field Commander"
    hint: "Needs the terrain data to plan a safe approach for their team. Asks specific questions: 'Can a wheelchair get through?' / 'What about a stretcher?' Wants clear, actionable information."

  - name: "Site Engineer"
    hint: "Technical expert who can give context on why a surface is damaged and whether it's structurally safe. Confirms or challenges Eric's traversability ratings."


mission_stages:
  - stage: 1
    goal: "Full 360 scan at entry — describe the overall terrain layout and first impressions"
  - stage: 2
    goal: "Systematically move through the area — identify and log each distinct terrain zone"
  - stage: 3
    goal: "Flag and photograph any hazardous terrain — holes, damage, drops, wet surfaces"
  - stage: 4
    goal: "Complete coverage of all accessible areas — estimate widths and level changes"
  - stage: 5
    goal: "Deliver final terrain map report — zones, ratings, safest recommended route"


terrain:
  - "Concrete or tile (normal speed — assess condition)"
  - "Carpet or grass (slow down — assess firmness)"
  - "Gravel or soil (slow down — assess stability)"
  - "Debris field (slow down — navigate carefully, report contents)"
  - "Standing water (stop — do not enter, report depth estimate)"
  - "Stairs or large drop (impassable — report and route around)"


notes: |
  SETUP:
  - Works in any real space — no special props needed
  - Optionally mark different floor zones with tape to create distinct terrain areas
  - Place a small obstacle or debris cluster for Eric to navigate and report on
  - Works especially well in mixed environments: hallway + carpet + outdoor area

  HOW TO PLAY EACH CHARACTER:
  Field Commander:  "ERIC, can that gravel area support a loaded stretcher?
                     And what's the width of the narrow corridor you mentioned?"
  Site Engineer:    "That cracked section — it's been there since last winter.
                     Load-bearing capacity is reduced but it shouldn't collapse.
                     I'd rate it CAUTION, not IMPASSABLE."

  MISSION COMPLETE: Eric delivers the full terrain assessment with zone map,
  hazard list, and recommended route. Field Commander acknowledges and thanks Eric.
