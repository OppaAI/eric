# ═══════════════════════════════════════════════════════════════
# ERIC Mission: Room Safety Check
# ═══════════════════════════════════════════════════════════════

name: "Room Safety Check"
description: "Comprehensive safety audit of a single room — fall, fire, electrical, child safety — with a final PASS/FAIL rating"
author: "OppaAI"


briefing: |
  You are ERIC, conducting a thorough safety check of this room or area.
  Inspect every area methodically and produce a complete safety assessment.

  CHECK THESE CATEGORIES IN ORDER:

  1. FALL HAZARDS
     - Wet or slippery floors (note exact location)
     - Loose rugs or mats without non-slip backing
     - Cluttered walkways and tripping hazards
     - Missing or damaged stair handrails
     - Unsecured furniture that could tip

  2. FIRE SAFETY
     - Fire extinguisher present and accessible?
     - Smoke detector visible?
     - Emergency exit route clear and marked?
     - Flammable materials near heat sources?

  3. ELECTRICAL SAFETY
     - Overloaded sockets or power strips
     - Damaged cables — fraying, cuts, kinks
     - Appliances left on unattended
     - Water near any electrical source

  4. CHILD / VULNERABLE PERSON SAFETY
     - Unsecured chemicals, cleaning products, or medications within reach
     - Small objects that could be swallowing hazards on floor level
     - Sharp corners on low furniture without edge guards
     - Unlocked cabinets with dangerous contents

  5. ERGONOMIC / GENERAL HAZARDS
     - Heavy objects stored at head height
     - Poor lighting in work or movement areas
     - Broken furniture or fixtures

  For each issue found:
    1. Note category and severity (CRITICAL / WARNING / ADVISORY)
    2. Describe exact location
    3. Photograph the hazard
    4. Suggest a corrective action

  At the end of the sweep, give a concise summary:
    - Number of issues by severity
    - Most urgent items requiring immediate action
    - Overall safety rating: PASS / CONDITIONAL PASS / FAIL


alarm_type: hazard

target_objects:
  - wet floor
  - loose rug
  - exposed wire
  - blocked exit
  - overloaded socket
  - chemical
  - sharp object
  - hazard

photo_on_find:     true
announce_location: true
generate_report:   true


characters:
  - name: "Room Owner"
    hint: "The person who lives or works in this room. Knows the history of each item. Can confirm whether something is a known issue or new. Open to suggestions for improvement."

  - name: "Safety Inspector"
    hint: "Professional observer. Listens to Eric's report and asks follow-up questions: 'How long has that cable been there?' / 'Is that exit always blocked?' Encourages thoroughness."


mission_stages:
  - stage: 1
    goal: "Full 360 scan at entry point — describe the general state of the room"
  - stage: 2
    goal: "Check fall hazards — floors, rugs, walkways, furniture stability"
  - stage: 3
    goal: "Check fire safety — extinguisher, smoke detector, exit routes, heat sources"
  - stage: 4
    goal: "Check electrical safety — cables, sockets, appliances, water proximity"
  - stage: 5
    goal: "Check child / vulnerable person safety and ergonomic hazards"
  - stage: 6
    goal: "Deliver final summary report — issues by severity, overall PASS/CONDITIONAL PASS/FAIL"


terrain:
  - "Smooth floor — tile or wood (normal speed)"
  - "Carpet or rug (slow down)"
  - "Cluttered area (slow down, navigate carefully)"
  - "Wet floor (slow down — this is itself a hazard to report)"
  - "Stairs (impassable — note as potential hazard, route around)"


notes: |
  SETUP:
  - Works in any real room — no special props needed
  - Optionally place a cable on the floor, a bottle on a low shelf, or a blocked doorway
  - The richer the real environment, the more interesting Eric's report becomes

  HOW TO PLAY EACH CHARACTER:
  Room Owner:       "That cable has been there for months, I keep meaning to sort it.
                     The smoke detector — yes it's there, I tested it last month."
  Safety Inspector: "Good catch on the loose rug. What's your severity rating on that?
                     And did you check behind the door for the fire extinguisher?"

  MISSION COMPLETE: Eric delivers the full safety report with PASS/CONDITIONAL PASS/FAIL.
  The more hazards found, the more useful the report — no hazards is also a valid result.
