# ERIC Mission: Room Safety Check

name: "Room Safety Check"
description: "Safety audit of a room — fall, fire, electrical, child safety — with PASS/FAIL rating"
author: "OppaAI"

briefing: |
  Conduct a thorough safety check. Inspect methodically and assess each category.

  1. FALL HAZARDS: wet/slippery floors, loose rugs, cluttered walkways, unstable furniture
  2. FIRE SAFETY: extinguisher present, smoke detector visible, exit route clear, flammables near heat
  3. ELECTRICAL: overloaded sockets, damaged cables, appliances left on, water near electrics
  4. CHILD SAFETY: chemicals/medications in reach, swallowing hazards on floor, sharp corners, unlocked cabinets
  5. GENERAL: heavy objects at head height, poor lighting, broken fixtures

  For each issue: category, severity (CRITICAL/WARNING/ADVISORY), exact location, photo, corrective action.

  Final summary: issues by severity, most urgent items, overall rating: PASS / CONDITIONAL PASS / FAIL

alarm_type: hazard

target_objects:
  - wet floor
  - loose rug
  - exposed wire
  - blocked exit
  - overloaded socket
  - chemical
  - sharp object
  - hazard

photo_on_find:     true
announce_location: true
generate_report:   true

scan_strategy:      video_sweep
loop_mission:       true
approach_on_detect: false
detect_distance:    2.0

characters:
  - name: "Room Owner"
    hint: "Knows the history of each item. Can confirm if something is a known issue. Open to improvement suggestions."

  - name: "Safety Inspector"
    hint: "Asks follow-up questions: 'How long has that cable been there?' / 'Is that exit always blocked?' Encourages thoroughness."

mission_stages:
  - stage: 1
    goal: "Full 360 scan at entry — describe general state of room"
  - stage: 2
    goal: "Check fall hazards — floors, rugs, walkways, furniture"
  - stage: 3
    goal: "Check fire safety — extinguisher, smoke detector, exits, heat sources"
  - stage: 4
    goal: "Check electrical safety — cables, sockets, appliances, water proximity"
  - stage: 5
    goal: "Check child/vulnerable person safety and ergonomic hazards"
  - stage: 6
    goal: "Deliver final summary — issues by severity, PASS/CONDITIONAL PASS/FAIL"

terrain:
  - "Smooth floor — tile or wood (normal speed)"
  - "Carpet (slow down)"
  - "Cluttered area (navigate carefully)"
  - "Wet floor (slow down — this is itself a hazard)"
  - "Stairs (impassable — note as hazard, route around)"
