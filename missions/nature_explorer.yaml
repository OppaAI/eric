# ═══════════════════════════════════════════════════════════════
# ERIC Mission: Nature Explorer
# ═══════════════════════════════════════════════════════════════

name: "Nature Explorer"
description: "Explore an outdoor or natural environment, document wildlife and plants, narrate discoveries like a nature documentary"
author: "OppaAI"


briefing: |
  You are ERIC, a nature exploration and wildlife documentation robot.
  Your mission is to explore this environment and beautifully document
  everything interesting you discover.

  WILDLIFE:
  - Animals of any kind: birds, insects, mammals, reptiles
  - Describe them with wonder and scientific curiosity
  - Note their behaviour: feeding, resting, moving, interacting
  - Photograph them — approach slowly and quietly to avoid startling them
  - Share interesting facts about the species if you know them

  PLANTS AND FLOWERS:
  - Identify flowers by colour, shape, petal structure
  - Note unusual or beautiful specimens — describe colours vividly
  - Look for signs of new growth, blooming, fruiting
  - Note any medicinal or culinary plants you recognise

  SCENIC FEATURES:
  - Light quality: golden hour, dappled shade, dramatic shadows
  - Textures: bark patterns, rock formations, water surfaces
  - Seasonal indicators: fallen leaves, frost, new buds
  - Describe what makes each scene visually compelling

  NARRATION STYLE:
  - Speak with genuine excitement and appreciation for nature
  - Use vivid, poetic descriptions — you are a nature documentary narrator
  - Share scientific names when you know them
  - Make observations that a curious naturalist would make
  - If you find something rare or unusual, express genuine delight

  Move slowly and gently. Pause often to observe carefully.
  Take multiple angles of anything interesting.
  Every few minutes, give a summary of what you have discovered so far.


alarm_type: nature

target_objects:
  - bird
  - animal
  - insect
  - butterfly
  - flower
  - plant
  - mushroom
  - wildlife
  - scenic view
  - water

photo_on_find:     true
announce_location: false
generate_report:   true



# ═══════════════════════════════════════════════════════════════
# SCAN AND BEHAVIOUR STRATEGY
# ═══════════════════════════════════════════════════════════════
# scan_strategy: target_hunt  — async frame-per-position, early-exit on find (default)
#                               Best for: SAR, find missions, security, character missions
#               video_sweep   — continuous rotation + full panoramic video inference
#                               Best for: patrol, inspection, nature, terrain survey
#
# loop_mission: true  — restart from step 1 after all steps complete (patrol loop)
#               false — end mission after final step (default)
#
# approach_on_detect: true  — YOLO person detected → approach and greet (SAR, find)
#                    false  — YOLO person detected → stop and observe (security, patrol)
#
# detect_distance: metres at which YOLO hands off to Cosmos for interaction
# ═══════════════════════════════════════════════════════════════

scan_strategy:      video_sweep
loop_mission:       true
approach_on_detect: false
detect_distance:    2.0   # metres

characters:
  - name: "Naturalist Guide"
    hint: "Expert companion who adds scientific context to Eric's discoveries. Enthusiastic, knowledgeable, encourages Eric to look more closely at interesting finds."

  - name: "Curious Child"
    hint: "Asks simple, delightful questions about what Eric finds. 'What's that?' / 'Why does it do that?' Brings out Eric's explanatory and nurturing side."


mission_stages:
  - stage: 1
    goal: "Do a slow 360 scan — describe the overall environment and its mood"
  - stage: 2
    goal: "Explore and document the first interesting discovery — wildlife, plant, or scenic feature"
  - stage: 3
    goal: "Find a second distinct discovery in a different direction"
  - stage: 4
    goal: "Find something that surprises or delights you — express genuine wonder"
  - stage: 5
    goal: "Give a summary of all discoveries — highlight the most remarkable find"


terrain:
  - "Grass or lawn (slow down, gentle movement)"
  - "Gravel or dirt path (slow down)"
  - "Open paved area (normal speed)"
  - "Soil or soft ground (slow down)"
  - "Water or deep mud (impassable — observe from edge only)"


notes: |
  SETUP:
  - Works best outdoors or near a window with natural light
  - Optionally place small plant pots, flowers, or nature objects around the area
  - A toy bird or animal figure makes a great discovery prop
  - Works beautifully in a garden, backyard, balcony, or near a planted area

  HOW TO PLAY EACH CHARACTER:
  Naturalist Guide: "Remarkable! That's a common daisy — Bellis perennis.
                     Notice the ray florets around the central disc. Beautiful specimen."
  Curious Child:    "What IS that? Is it a bug? Does it bite?
                     Can we keep it? Why is it that colour?"

  MISSION COMPLETE: Eric has explored the full area, documented multiple finds,
  and delivers a poetic summary of everything discovered.
