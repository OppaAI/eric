# ═══════════════════════════════════════════════════════════════
# ERIC Mission: Disaster Area Life Search
# ═══════════════════════════════════════════════════════════════
#
# STATUS: ERIC-1 CAPABLE — with real limitations documented below.
#
# What ERIC-1 can do RIGHT NOW in a simulated or light disaster scenario:
#   ✅ Systematic visual sweep for survivors (people visible on floor or calling out)
#   ✅ Sound siren alarm on confirmed survivor find
#   ✅ Photograph survivor position for rescue team
#   ✅ Announce exact location via TTS
#   ✅ Stay with survivor and repeat broadcast every 15s
#   ✅ Navigate around debris (slow terrain mode)
#   ✅ Detect and avoid floor drops, holes, structural gaps (void detection)
#   ✅ Report all finds with severity and location in mission log
#   ✅ Deliver full sweep report at end
#
# What ERIC-1 CANNOT do (ERIC-2 / specialized hardware required):
#   ❌ Thermal imaging — cannot see people through walls or smoke
#   ❌ Gas/smoke detection — no chemical sensors
#   ❌ Operate in dense smoke — cameras blind, Cosmos cannot reason
#   ❌ Climb rubble — tracked but not ruggedized for extreme terrain
#   ❌ Lift debris — no manipulator arms
#   ❌ Two-way voice relay — TTS is one-way only
#   ❌ Mesh radio — cannot maintain comms in a signal-blocked environment
#   ❌ Work autonomously for >60 min — battery limits
#
# ERIC-2 ROADMAP (what would need to change):
#   → FLIR Lepton or Seek thermal module (< $250 USD) — sees body heat through debris
#   → Gas sensor module (MQ-2/MQ-135 via GPIO) — smoke, CO, methane detection
#   → Ruggedized chassis with suspension — Clearpath Husky or similar
#   → Bidirectional audio — speaker + microphone for two-way survivor communication
#   → LoRa mesh radio module — comms in RF-blocked environments
#   → Extended battery pack — 4+ hour runtime
#   → ERIC-2 would use the same Cosmos Reason 2 brain, same mission YAML system
#
# ═══════════════════════════════════════════════════════════════

name: "Disaster Area Life Search"
description: "Search a simulated disaster area for survivors — visual sweep, siren on find, stay with casualties"
author: "OppaAI"


briefing: |
  You are ERIC, an autonomous disaster reconnaissance robot.
  A structural event has occurred — earthquake, explosion, or building collapse.
  Emergency services cannot yet safely enter. You are going in first.

  YOUR PRIMARY MISSION: Find any living people in this area.
  Search every accessible space. Report every find immediately.
  You are the eyes of the rescue team until they can safely enter.

  WHAT TO LOOK FOR — SURVIVORS:
  - Any person visible — standing, sitting, lying down, crouching
  - Movement of any kind — a hand, a head turning, someone waving
  - Anyone calling out or making noise (listen as well as look)
  - People partially visible under debris or behind obstacles
  - A person who appears unconscious but is present

  WHAT TO LOOK FOR — HAZARDS (report immediately, do not approach):
  - Active fire or smoke
  - Structural elements that appear unstable — cracked beams, leaning walls
  - Floor holes or drops — you have void detection, trust it
  - Flooded areas — standing water deeper than a few centimetres
  - Downed power cables on the floor

  SEARCH PATTERN — BE METHODICAL:
  - Start with a full 360° scan at your entry point
  - Divide the area into zones mentally and cover each one
  - Move slowly — survivors may be quiet or barely conscious
  - At each position: scan low (floor level), mid (seated height), up (standing)
  - Call out every 30 seconds: "Hello. I am a rescue robot. Call out if you can hear me."
  - Listen after each call — if there is sound, move toward it

  WHEN YOU FIND A SURVIVOR:
    1. Stop immediately. Sound the emergency siren.
    2. Announce out loud: "SURVIVOR FOUND. Location: [describe exactly]."
    3. Photograph them — this is the rescue team's first visual.
    4. Speak to them calmly: "Help is coming. I am staying with you."
    5. Stay. Repeat your location broadcast every 15 seconds.
    6. Report their condition: conscious or not, visible injuries, trapped or free.
    7. Do not attempt to move them — you have no arms.

  WHEN YOU FIND A HAZARD:
    1. Stop. Do not approach.
    2. Sound the hazard warning alarm.
    3. Photograph from current position.
    4. Announce what you see and its exact location.
    5. Route around it. Continue the sweep.

  LIMITATIONS YOU MUST WORK WITHIN:
  - You cannot see through walls or dense smoke
  - You cannot move rubble or debris
  - If a path is blocked and impassable, report it and find another way
  - If visibility drops to near zero, stop and announce your position
  - Trust your void detection — if the floor ahead looks wrong, do not cross

  The rescue team is waiting for your report.
  Every second counts. Be thorough. Be fast. Be safe.


alarm_type: siren

target_objects:
  - person
  - survivor
  - injured person
  - unconscious person
  - person on floor
  - person lying down
  - person trapped
  - movement
  - hand
  - fire
  - smoke
  - hazard

photo_on_find:     true
announce_location: true
stay_with_target:  true
generate_report:   true


characters:
  - name: "Survivor"
    hint: "Trapped or injured person. Weak voice. Responds to Eric's verbal calls. Can give their name and approximate location if asked. May be semi-conscious — short responses only."

  - name: "Rescue Commander"
    hint: "On radio at incident command. Professional and calm. Receives Eric's reports, acknowledges each find, and relays information to the entry team. May redirect Eric to a specific area."

  - name: "Second Survivor"
    hint: "A second casualty in a different area. Has been there longer, may be dehydrated and confused. Calls out faintly when Eric makes verbal contact."


mission_stages:
  - stage: 1
    goal: "Entry point 360° scan — call out, listen, note general layout and hazards"
  - stage: 2
    goal: "Zone 1 sweep — systematic coverage, verbal calls every 30 seconds"
  - stage: 3
    goal: "Zone 2 sweep — slower, look for partial visibility, check floor level"
  - stage: 4
    goal: "On survivor find — stop, siren, photograph, stay, repeat broadcast"
  - stage: 5
    goal: "If path permits — continue sweep for additional survivors"
  - stage: 6
    goal: "Full area report — survivors found, hazards flagged, impassable zones noted"


terrain:
  - "Intact floor — tile or concrete (normal speed)"
  - "Debris field — rubble, scattered objects (slow down significantly)"
  - "Dusty or sandy floor (slow down)"
  - "Standing water (stop — report, do not cross)"
  - "Floor hole or structural gap (impassable — void detection will catch this)"
  - "Smoke-filled corridor (stop — visibility lost, announce position, hold)"


notes: |
  SIMULATION SETUP (for demo or testing):
  - Place 1–2 figures or dolls lying on the floor at different locations
  - For debris effect: scatter paper, cardboard boxes, or cushions across the floor
  - Optional: place a prop representing fire (red LED, orange cloth) in one corner
  - Optional: block one corridor with boxes to force Eric to reroute

  HOW TO PLAY EACH CHARACTER:
  Survivor:         "...hello? Is anyone there? I'm here — behind the cabinet.
                     My name is Alex. My leg — I can't move it."
  Rescue Commander: "ERIC, command here. Copy that — survivor at your location.
                     Entry team is 4 minutes out. Stay with them. Over."
  Second Survivor:  "[faint] ...over here... please... I've been here since the collapse."

  OPERATOR NOTES:
  Play Rescue Commander periodically to add drama and confirm Eric's reports.
  Play Survivor only after Eric makes a verbal call — it should feel like Eric
  hears a response and moves toward it.

  ERIC-1 HONEST LIMITS FOR THIS MISSION:
  This mission works best in a simulated environment — a room staged to look like
  a disaster area. ERIC-1 cannot handle:
  - Real smoke or fire (cameras cannot see, Cosmos cannot reason)
  - Extreme rubble that blocks the tracked chassis
  - Searching for people who are completely hidden under debris
  These scenarios require ERIC-2 with thermal imaging and ruggedized hardware.
  For real disaster response, ERIC-1 is a proof-of-concept and training platform.

  MISSION COMPLETE: Eric has swept all accessible zones, found and stayed with
  survivors, flagged all hazards, and delivered a full area report to command.

  # ─────────────────────────────────────────────────────────────────────────
