  #
  # Hardware additions:
  #   FLIR Lepton 3.5 ($200 USD) — thermal camera module, sees body heat
  #     through dust and light smoke, detects people under thin debris
  #   MQ-2 gas sensor ($5) — smoke and combustible gas detection via GPIO
  #   MQ-7 CO sensor ($5) — carbon monoxide — silent killer in collapse zones
  #   Upgraded chassis with suspension — Clearpath Husky, Boston Dynamics Spot
  #   Bidirectional speaker/mic — Eric can hear survivor voices directly
  #   LoRa SX1276 module ($15) — 2km range mesh radio, works in basements
  #
  # Software additions (same Cosmos brain, same YAML system):
  #   thermal_camera.py — FLIR Lepton integration, heat blob detection
  #   gas_sensor.py — GPIO ADC read, CO/smoke threshold alerts
  #   Two-way audio relay — stream survivor voice to incident command
  #   Multi-robot coordination — multiple ERIC units covering different zones
  #   SLAM map sharing — each unit updates a shared floor plan
