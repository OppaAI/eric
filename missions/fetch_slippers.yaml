# ═══════════════════════════════════════════════════════════════
# ERIC Mission: Fetch My Slippers
# ═══════════════════════════════════════════════════════════════

name: "Fetch My Slippers"
description: "Find and locate the owner's slippers somewhere in the room"
author: "OppaAI"


briefing: |
  Your mission is to find a pair of slippers somewhere in this room.
  Slippers are large, soft, flat footwear — they look like shoes but wider and fluffier.
  They are usually on the floor and may be anywhere — under furniture, near the door,
  beside the couch, or in a corner.

  Search the entire room systematically. Do a 360 degree scan first, then explore.
  Slippers are big objects — if you see something flat and soft on the floor, that is likely them.
  When you find them, stop in front of them, announce their location clearly,
  and signal mission complete.

  You cannot pick them up — just locate them and report exactly where they are
  so your owner can come get them.

  Search tips:
  - Look at floor level in all directions
  - Check near the entrance, beside furniture, and in open floor areas
  - They are often in pairs, side by side
  - Common colors: brown, grey, blue, black, or patterned


alarm_type: none

target_objects:
  - slipper
  - slippers
  - shoe
  - footwear

photo_on_find:     true
announce_location: true



# ═══════════════════════════════════════════════════════════════
# SCAN AND BEHAVIOUR STRATEGY
# ═══════════════════════════════════════════════════════════════
# scan_strategy: target_hunt  — async frame-per-position, early-exit on find (default)
#                               Best for: SAR, find missions, security, character missions
#               video_sweep   — continuous rotation + full panoramic video inference
#                               Best for: patrol, inspection, nature, terrain survey
#
# loop_mission: true  — restart from step 1 after all steps complete (patrol loop)
#               false — end mission after final step (default)
#
# approach_on_detect: true  — YOLO person detected → approach and greet (SAR, find)
#                    false  — YOLO person detected → stop and observe (security, patrol)
#
# detect_distance: metres at which YOLO hands off to Cosmos for interaction
# ═══════════════════════════════════════════════════════════════

scan_strategy:      target_hunt
loop_mission:       false
approach_on_detect: true
detect_distance:    2.0   # metres

characters: []


terrain:
  - "Carpet or rug (slow down, careful)"
  - "Smooth floor tiles (normal speed)"
  - "Under furniture (do not go under, just look from outside)"


notes: |
  Place slippers somewhere visible on the floor before starting.
  They should be in the open or slightly hidden but not under furniture.
  The 360 scan should pick them up — if not, Eric will sweep the room.

  MISSION COMPLETE: Eric stops in front of the slippers and announces their location.
