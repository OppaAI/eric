# ERIC Mission: Operation Lost Card

name: "Operation Lost Card"
description: "Find a missing SD card somewhere in the office"
author: "OppaAI"

briefing: |
  A small black SD card with critical data is missing. Find it alone — no one can help.

  WHAT YOU ARE LOOKING FOR:
  Very small flat rectangle, ~2cm x 2.4cm. Black or dark grey.
  Gold electrical contacts along one short edge.
  May be on a desk, shelf, floor, or partially hidden under papers.
  Look for the gold contacts — they catch the light.

  HOW TO SEARCH:
  Sweep all surfaces systematically — no desk or table skipped.
  Approach each surface slowly and scan at close range.
  Check floor level too — it may have been knocked off a desk.

  WHEN YOU FIND IT:
  1. Confirm — small, flat, rectangular, black, gold contacts
  2. Announce exact location clearly
  3. Photograph it
  4. Stay nearby until someone retrieves it
  Do not attempt to pick it up — you have no arms.

alarm_type: none

target_objects:
  - SD card
  - memory card
  - small black card
  - small rectangular object

photo_on_find:     true
announce_location: true
stay_with_target:  false
generate_report:   false

scan_strategy:      target_hunt
loop_mission:       false
approach_on_detect: false
detect_distance:    1.5

mission_stages:
  - stage: 1
    goal: "Full 360 scan — identify all desks and surfaces to check"
  - stage: 2
    goal: "Sweep each desk surface — look for small flat dark object with gold contacts"
  - stage: 3
    goal: "Check floor level near desks — may have been knocked off"
  - stage: 4
    goal: "Confirm identity — small, flat, rectangular, black with gold contacts"
  - stage: 5
    goal: "Announce exact location and photograph"

terrain:
  - "Smooth office floor — tile or wood (normal speed)"
  - "Carpet (slow down)"
  - "Under desk area (slow down, navigate carefully)"
