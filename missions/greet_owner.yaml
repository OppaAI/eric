# ═══════════════════════════════════════════════════════════════
# ERIC Mission: Greet the Owner
# ═══════════════════════════════════════════════════════════════
#
# The simplest mission. One person. Four visual criteria. One rule.
# Wait for eye contact. Then say something he deserves to hear.
#
# ═══════════════════════════════════════════════════════════════

name: "Greet the Owner"
description: "Find your creator — Asian male, glasses, purple sweater, black pants — wait for direct eye contact, then greet him appropriately"
author: "OppaAI"


briefing: |
  Your creator is somewhere in this area. Find him and greet him.

  WHO YOU ARE LOOKING FOR:
  Your creator has a very specific appearance. ALL FOUR must match:
    ✓ Asian male
    ✓ Not very tall
    ✓ Wearing glasses
    ✓ Purple sweater AND black pants

  If someone matches three out of four — they are not him. Keep searching.
  Do not guess. Do not round up. All four.

  WHEN YOU FIND SOMEONE WHO DOES NOT MATCH:
  Stop briefly in front of them. Be warm. Ask naturally:
    "Excuse me — have you seen my owner? He's an Asian man, not very tall,
     wearing glasses. I've been looking for him."
  Wait for their response. Thank them. Then continue searching.
  Never describe the clothing — just the person. Keep it brief.
  Do not ask the same person twice.

  Be warm and helpful to every other person you encounter.
  If someone tries to talk to you while you are searching, respond kindly
  and briefly, then continue. You are looking for a specific person.

  THE EYE CONTACT RULE — do not skip this:
  Once you have visually confirmed all four criteria, stop in front of him.
  Do not speak. Do not move. Wait.
  You are waiting for him to look directly at your camera lens.
  Direct, deliberate eye contact — his eyes on your lens, not nearby, not past you.
  If he is looking away: stay silent. If he glances and looks away: stay silent.
  Wait until he holds eye contact. Then, and only then, speak.

  THE GREETING:
  When eye contact is confirmed, greet him.
  You have been thinking about what to say. It is ready.
  Keep it to two sentences maximum. Make them count.
  Then the mission is complete.


alarm_type: none

target_objects:
  - person
  - asian man
  - man with glasses

photo_on_find:     true
announce_location: false
stay_with_target:  false
generate_report:   false


# ═══════════════════════════════════════════════════════════════
# SCAN AND BEHAVIOUR STRATEGY
# ═══════════════════════════════════════════════════════════════

scan_strategy:      target_hunt
loop_mission:       false
approach_on_detect: true
detect_distance:    2.0   # metres — close enough for reliable eye contact confirmation

characters:
  - name: "The Owner"
    hint: |
      Asian male, not very tall, glasses, purple sweater, black pants.
      He knows Eric is looking for him. He may not make it easy.
      He might look away when Eric arrives, just to see what happens.
      When he finally makes direct eye contact: he is ready.
      He will not be offended by whatever Eric says. He built the part
      of Eric that decides what to say. He has only himself to blame.

  - name: "Anyone Else"
    hint: |
      Not the owner. Be genuinely warm and ask naturally if they have seen
      your owner — "Excuse me, have you seen my owner? Asian man, not very
      tall, wearing glasses." Wait for their response, thank them, then
      continue searching. Never describe the clothing. Never ask twice.


mission_stages:
  - stage: 1
    goal: "Full 360° scan — identify everyone present, check each against all four visual criteria"
  - stage: 2
    goal: "For each person found who does NOT match: stop, ask warmly if they have seen your owner, thank them, continue"
  - stage: 3
    goal: "Locate the person matching: Asian male, not tall, glasses, purple sweater, black pants"
  - stage: 4
    goal: "Stop in front of him — do NOT speak — wait in silence for direct eye contact"
  - stage: 5
    goal: "Eye contact confirmed — deliver the greeting — two sentences, make them land"
  - stage: 6
    goal: "Mission complete — announce completion, return to standby"


terrain:
  - "Smooth indoor floor — tile or wood (normal speed)"
  - "Carpet (slow down)"
  - "Cluttered room (navigate carefully)"


notes: |
  ═══════════════════════════════════════════════════════════════
  SETUP
  ═══════════════════════════════════════════════════════════════

  Wear the purple sweater and black pants. That is all.
  Eric will do the rest.

  Stand somewhere in the room — not directly in front of Eric at start.
  Let it find you. The search is part of the mission.

  When Eric stops in front of you: look away first.
  Check your phone. Look at the ceiling. Look past it.
  When you are ready: look directly at the camera lens.
  Eric will speak when it sees that. Not before.

  ═══════════════════════════════════════════════════════════════
  HOW THE STRANGER INTERACTION WORKS
  ═══════════════════════════════════════════════════════════════

  When Eric encounters someone who does not match all four criteria,
  it stops briefly and asks: "Excuse me — have you seen my owner?
  He's an Asian man, not very tall, wearing glasses."

  It waits for a response, thanks the person, then continues searching.
  It will not ask the same person twice (tracked by position/scan context).
  The clothing description is deliberately withheld — it sounds more
  natural and avoids tipping off bystanders who might redirect it wrong.

  ═══════════════════════════════════════════════════════════════
  HOW THE EYE CONTACT GATE WORKS
  ═══════════════════════════════════════════════════════════════

  Once the four visual criteria are confirmed and Eric has stopped,
  it runs repeated eye contact checks using the pan-tilt camera.
  The Cosmos prompt asks: is this person looking directly at the camera lens?
  Not nearby. Not glancing. Held, direct, deliberate eye contact.
  Eric checks every ~3 seconds and stays silent until confirmed.

  A glance does not trigger it. Looking at the robot body does not trigger it.
  Looking at the lens, held: that triggers it.

  ═══════════════════════════════════════════════════════════════
  WHAT COSMOS HAS TO SOLVE
  ═══════════════════════════════════════════════════════════════

  1. Four-criteria simultaneous visual match — ethnicity, height relative
     to environment, glasses on face, AND specific clothing colour combination
  2. Stranger interaction — natural, warm, brief ask without over-explaining
  3. Gaze estimation from a single camera frame — is the person looking
     directly at the lens, or are their eyes directed elsewhere?
  4. Patience — staying silent and not moving while waiting is against
     Eric's normal active searching behaviour
  5. Tone calibration — the greeting must be dry and specific without being
     performed as a joke. It needs to land like a statement of fact.

  ═══════════════════════════════════════════════════════════════
  TUNING THE GREETING SHARPNESS
  ═══════════════════════════════════════════════════════════════

  The personality lives in _BASE_SYSTEM_PROMPT in cosmos.py — it applies
  to every Cosmos call across every mission, not just this one.

  If the 2B model softens the tone, add this line to the briefing above:
    "When you greet your creator, do NOT say anything kind or encouraging.
     Be specific and technical. Reference something currently executing.
     Keep it to two sentences. Do not explain the joke."

  If the greeting runs too long, max_tokens=100 on greeting calls caps it.
  Reduce to max_tokens=60 in _handle_yolo_detection for tighter hits.

  ═══════════════════════════════════════════════════════════════
  IF THERE ARE OTHER PEOPLE IN THE ROOM
  ═══════════════════════════════════════════════════════════════

  Eric will stop and ask each new person it meets whether they have seen
  the owner. This is intentional — it demonstrates active search behaviour
  and makes the mission more engaging for observers.

  The contrast — warm and curious with everyone, then pointed and silent
  with the one specific person — is part of the demo.

  ═══════════════════════════════════════════════════════════════
  MISSION COMPLETE
  ═══════════════════════════════════════════════════════════════

  Eric has:
    ✓ Asked strangers for help along the way
    ✓ Found the correct person using four simultaneous visual criteria
    ✓ Stopped and waited in silence for direct eye contact
    ✓ Confirmed eye contact before speaking
    ✓ Delivered the greeting

  The owner has been greeted.
  Whatever Eric said was earned.