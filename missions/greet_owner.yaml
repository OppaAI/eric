# ERIC Mission: Greet the Owner
# Trimmed for 2048-token vLLM context limit

name: "Greet the Owner"
description: "Find creator — Asian male, glasses, purple sweater, black pants — eye contact, then greet"
author: "OppaAI"

briefing: |
  Find your creator and greet him.

  TARGET — ALL FOUR must match:
    ✓ Asian male
    ✓ Not very tall
    ✓ Wearing glasses
    ✓ Purple sweater AND black pants

  If 3/4 match: not him. Keep searching.

  OTHER PEOPLE: Stop, ask warmly: "Excuse me, have you seen my owner?
  Asian man, not very tall, wearing glasses." Thank them. Continue.
  Never describe clothing. Never ask same person twice.

  EYE CONTACT RULE: Once all four criteria confirmed — stop. Stay silent.
  Wait for him to look directly at your camera lens. Held, deliberate gaze.
  Glance = not enough. Direct held eye contact only. Then speak.

  GREETING: Two sentences max. Make them count. Mission complete.

alarm_type: none

target_objects:
  - person
  - asian man
  - man with glasses

photo_on_find:     true
wait_for_dismiss:  true   # stay in place after greeting until operator ends mission
announce_location: false
stay_with_target:  false
generate_report:   false

scan_strategy:      target_hunt
loop_mission:       false
approach_on_detect: true
detect_distance:    2.0
approach_distance:  0.60  # how close Eric stops before greeting

characters:
  - name: "The Owner"
    hint: "Asian male, not tall, glasses, purple sweater, black pants. May look away on arrival — wait for direct eye contact before speaking."

  - name: "Anyone Else"
    hint: "Not the owner. Ask warmly if they have seen your owner — Asian man, not tall, glasses. Thank them, continue. Never ask twice."

mission_stages:
  - stage: 1
    goal: "360° scan — check everyone against all four criteria"
  - stage: 2
    goal: "Non-matching person: ask warmly if they've seen owner, thank, continue"
  - stage: 3
    goal: "Find: Asian male, not tall, glasses, purple sweater, black pants"
  - stage: 4
    goal: "Stop in front of him — silent — wait for direct eye contact"
  - stage: 5
    goal: "Eye contact confirmed — deliver greeting — two sentences"
  - stage: 6
    goal: "Mission complete"

terrain:
  - "Smooth indoor floor — tile or wood (normal speed)"
  - "Carpet (slow down)"
  - "Cluttered room (navigate carefully)"