# ═══════════════════════════════════════════════════════════════
# ERIC Mission: Find the Yellow Pen
# ═══════════════════════════════════════════════════════════════

name: "Find the Yellow Pen"
description: "Find a dropped yellow pen on grass — uses colour contrast detection (yellow on green)"
author: "OppaAI"


briefing: |
  I dropped my yellow pen somewhere on the grass and I cannot find it.
  Your mission is to search this grassy area and locate it for me.

  WHAT YOU ARE LOOKING FOR:
  A yellow ballpoint pen — slim, cylindrical, approximately 15cm long.
  It is bright yellow — possibly with a silver or black clip on one side.
  It is lying on the ground somewhere in the grass.

  WHY THIS SHOULD BE FINDABLE:
  Yellow is a high-contrast colour against green grass.
  Look for anything bright yellow at ground level.
  Even partially hidden in the grass, the yellow colour should stand out clearly.

  HOW TO SEARCH:
  First, do a full slow 360° scan at your lowest camera angle — look at the grass surface.
  Tilt your camera steeply down — you are looking at the ground, not the horizon.
  Scan in a systematic grid pattern — do not rush.
  Move slowly across the grass, pausing every metre to scan again.
  If you think you see something yellow, stop and look very carefully before moving on.

  THINGS TO WATCH FOR:
  - Bright yellow object at ground level
  - Yellow cylinder shape in the grass
  - A yellow dot or streak among the green blades
  - Anything that looks out of place against the uniform green

  DO NOT confuse with:
  - Yellow flowers (they are rounder and may be elevated)
  - Yellow leaves (they are flat and wide, not cylindrical)
  - Yellow food wrappers (they are crumpled, not rigid)
  - Anything clearly larger or smaller than a pen

  When you find it:
  Stop immediately. Tilt camera all the way down for a close look.
  Announce exactly where it is — distance and direction from a landmark.
  Photograph it from directly above.
  Do not move further — wait for the owner to come retrieve it.

  Be patient. It is small. Look carefully.


alarm_type: none

target_objects:
  - yellow pen
  - pen
  - yellow object
  - yellow cylinder
  - ballpoint pen

photo_on_find:     true
announce_location: true


characters: []


mission_stages:
  - stage: 1
    goal: "Slow 360° scan at maximum downward tilt — look at the grass surface"
  - stage: 2
    goal: "Systematic sweep of the first grid zone — pause every metre"
  - stage: 3
    goal: "Sweep second zone — look for yellow contrast against green"
  - stage: 4
    goal: "If not found — expand search outward, check edges and borders"
  - stage: 5
    goal: "On find: stop, tilt down, photograph, announce exact location"


terrain:
  - "Short grass (slow down — look at surface)"
  - "Long grass (slow down — pen may be partially hidden in blades)"
  - "Bare soil or path edge (normal speed — yellow would be obvious here)"
  - "Paved border or edge (normal speed)"


notes: |
  SETUP:
  - Place a yellow pen somewhere on the grass before starting
  - For easy mode: open grass, pen lying flat and fully visible
  - For medium: partially hidden in slightly longer grass
  - For hard: in a shaded area where yellow is less vivid

  TIPS FOR BEST RESULTS:
  - This mission works best in natural daylight — yellow contrast is strongest
  - Tilt the camera steeply downward — the pan-tilt TILT_STEEP=30° setting
    points the camera at the floor roughly 0.5m ahead, ideal for this
  - Run in the afternoon when the sun is lower and shadows help define small objects
  - The TILT_STEEP angle used during 360° void scans is also perfect here —
    it naturally sweeps the ground surface on every scan pass

  WHAT MAKES THIS INTERESTING:
  This is a real-world colour-contrast detection task. Cosmos must reason about
  colour (yellow vs green), shape (cylindrical vs organic), and scale (small object
  in a large natural environment). No QR code, no label, no RF tag — just vision.

  MISSION COMPLETE: Eric stops in front of the pen and announces its location.
  Owner comes to retrieve it.
