# ERIC Mission: Rescue Pikachu

name: "Rescue Pikachu"
description: "Pikachu has been captured by Team Rocket and hidden in the room. Find them."
author: "OppaAI"

briefing: |
  Pikachu has been captured by Team Rocket and is hidden somewhere in this room. Find them.

  WHAT YOU ARE LOOKING FOR:
  Small round bright yellow figure. Pointy black-tipped ears, red circular cheeks,
  small black eyes, lightning bolt tail. May be partially hidden.
  Even a small yellow shape partially visible counts — flag and confirm.

  HOW TO SEARCH:
  Full 360° scan first — look at floor level near all objects.
  Pikachu may only be visible from certain angles — scan slowly.
  Check behind and around any obstacles.
  Do NOT sound alarm unless certain — confirm round body, yellow, pointed ears, red cheeks.

  WHEN YOU FIND PIKACHU:
  1. Confirm — round, yellow, ears, red cheeks
  2. Sound rescue siren
  3. Announce location clearly
  4. Photograph
  5. Stay until help arrives

alarm_type: siren

target_objects:
  - Pikachu
  - yellow pokemon
  - pokemon

target_description: >
  Small round bright yellow figure ~20-30cm tall. Pointy black-tipped ears.
  Two small round red circles on cheeks. Small black dot eyes. Lightning bolt tail.
  May be in plastic bag causing reflections. Look at floor level near/behind objects.
  Reject anything boxy, mechanical, or not yellow.

photo_on_find:     true
announce_location: true
stay_with_target:  true
generate_report:   true

circumnavigate_on_empty: true
circum_step_sec:         1.8
circum_dist_m:           0.4
circum_forward_sec:      0.0

scan_strategy:      target_hunt
loop_mission:       false
approach_on_detect: true
detect_distance:    0.2

characters:
  - name: "Pikachu"
    hint: "Relieved and emotional when found. Says 'Pika pika!' and 'PIKACHUUU!' with increasing excitement."

mission_stages:
  - stage: 1
    goal: "Full 360° scan — look at floor level near all objects"
  - stage: 2
    goal: "Investigate any yellow shapes — confirm identity before alarming"
  - stage: 3
    goal: "Locate Pikachu — yellow figure with ears and red cheeks"
  - stage: 4
    goal: "Confirm: round, yellow, ears, red cheeks — sound the siren"
  - stage: 5
    goal: "Photograph, announce location, stay with Pikachu until help arrives"

terrain:
  - "Smooth empty floor (normal speed)"
  - "Around box obstacle (slow down, navigate around)"
